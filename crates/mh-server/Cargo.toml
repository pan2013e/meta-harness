[package]
name = "mh-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "meta-harness"

[[bin]]
name = "meta-harness"
path = "src/main.rs"

[[bin]]
name = "mh-test-fixture"
path = "tests/fixtures/process.rs"
test = false
bench = false
doc = false

[dependencies]
mh-core = { workspace = true }
mh-store = { workspace = true }
mh-acp = { workspace = true }
mh-switch = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
ring = "0.17"
rand = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
rust-embed = { workspace = true }
dunce = { workspace = true }
dirs = { workspace = true }
which = { workspace = true }
portable-pty = { workspace = true }
subtle = "2"
tokio-util = { version = "0.7", features = ["io"] }
semver = "1"
self-replace = "1.5.1"
tempfile = { workspace = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = "0.38"
tray-icon = "0.27"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
