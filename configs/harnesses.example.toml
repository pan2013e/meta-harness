# Example Harness & Switch Configuration for Meta-Harness
# Copy to `configs/harnesses.local.toml` or `%APPDATA%/meta-harness/harnesses.toml` to customize.
# All adapters inherit the user's local login/subscription environment by default.

[server]
bind = "127.0.0.1:4410"
# Set `bind = "0.0.0.0:4410"` with `--enable-remote-token` (or `auth_token_env`) for LAN / Tailscale access.
open_browser_on_start = true

[switch]
max_agent_hops_per_user_turn = 6
peer_consult_timeout_secs = 180
idle_process_ttl_secs = 900
# "worktree_smart" auto-allows file reads/writes inside the agent's isolated Git worktree
# and prompts in Group Chat for shell commands & outside-worktree access (with session pattern rules).
default_permission_policy = "worktree_smart" # "worktree_smart" | "strict" | "autonomous_sandbox"

[git]
# Isolated per-session integration worktree + per-executor worktrees by default
isolation_mode = "worktree_per_member"
auto_merge_clean_turns = true
sync_idle_worktrees_after_merge = true

[memory]
# Lightweight Orchestrator LLM curation pass after completed jobs (folded into merge/synthesis turns when active)
curation_mode = "orchestrator_llm" # "orchestrator_llm" | "deterministic_only"

# -----------------------------------------------------------------------------
# Harness Adapters (Shared CLI Driver + Shared Subscription Quota Pool)
# Multiple session members/personas (e.g. Orchestrator `@claude` + Executor `@claude`
# or `@codex-reviewer`) can reference the same adapter and share its quota bucket.
# -----------------------------------------------------------------------------

[adapters.codex]
# profile_dir = "profiles/codex" # Optional, relative to the Meta-Harness data directory
display_name = "Codex"
accent_color = "#10a37f"
enabled = true
# Speaks ACP over stdio while reusing ~/.codex user subscription login
command = "npx"
args = ["-y", "@agentclientprotocol/codex-acp"]
quota_provider = "codex_local"
exact_quota_probe_opt_in = false

[adapters.codex.characteristics]
strengths = ["backend-systems", "rust", "refactoring", "debugging", "test-generation", "precise-diffs"]
latency_tier = "medium"
context_window_tier = "large"

[adapters.claude]
# profile_dir = "profiles/claude"
display_name = "Claude Code"
accent_color = "#d97757"
enabled = true
# Speaks ACP over stdio while reusing ~/.claude Pro/Max subscription login
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp"]
quota_provider = "claude_local"
exact_quota_probe_opt_in = false

[adapters.claude.characteristics]
strengths = ["architecture", "frontend-ui", "nuanced-design", "code-review", "conflict-resolution"]
latency_tier = "fast"
context_window_tier = "large"

[adapters.antigravity]
# profile_dir = "profiles/antigravity"
display_name = "Antigravity"
accent_color = "#4285f4"
enabled = true
# Native ACP mode via Antigravity CLI (`agy --acp`) or Gemini CLI (`gemini --acp`)
command = "agy"
args = ["--acp"]
fallback_commands = [
  { command = "gemini", args = ["--acp"] }
]
quota_provider = "google_local"
exact_quota_probe_opt_in = false

[adapters.antigravity.characteristics]
strengths = ["broad-codebase-research", "long-context", "orchestration", "fullstack-synthesis", "planning"]
latency_tier = "fast"
context_window_tier = "ultra"
